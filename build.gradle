plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit for testing
    testImplementation 'junit:junit:4.13.2'
    
    // Optional: Add more testing libraries if needed
    // testImplementation 'org.mockito:mockito-core:4.6.1'
    
    // Optional: Add logging framework
    // implementation 'org.slf4j:slf4j-api:1.7.36'
    // implementation 'ch.qos.logback:logback-classic:1.2.11'
}

application {
    mainClass = 'com.example.Main'
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.example.Main',
            'Implementation-Title': 'Java Project Example',
            'Implementation-Version': version
        )
    }
}

// Custom tasks for demonstration
task runBadNamingExample(type: JavaExec) {
    group = 'application'
    description = 'Run the bad naming example (Calc.java)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.CalcDemo'
}

task runGoodNamingExample(type: JavaExec) {
    group = 'application'
    description = 'Run the good naming example (Calculator.java)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.CalculatorDemo'
}

task runOrderProcessorExample(type: JavaExec) {
    group = 'application'
    description = 'Run the order processor example'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.OrderProcessorDemo'
}

// Clean and build tasks
clean {
    delete 'build'
}

build.dependsOn test
